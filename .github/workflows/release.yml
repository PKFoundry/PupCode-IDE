name: Build desktop release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, such as v0.1.0"
        required: true
        type: string

      release_name:
        description: "Optional release name"
        required: false
        type: string

      draft:
        description: "Create as a draft release"
        required: true
        default: true
        type: boolean

# Prevent two runs for the same tag from racing each other.
concurrency:
  group: pupcode-release-${{ inputs.tag }}
  cancel-in-progress: false

# Default all jobs to read-only access.
permissions:
  contents: read

jobs:
  create-release:
    name: Create or locate release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      release_id: ${{ steps.release.outputs.release_id }}

    steps:
      - name: Create or locate release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_NAME_INPUT: ${{ inputs.release_name }}
          RELEASE_DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail

          echo "Looking for an existing release with tag: ${RELEASE_TAG}"

          RELEASE_IDS="$(
            gh api \
              --paginate \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"${RELEASE_TAG}\") | .id"
          )"

          RELEASE_COUNT="$(
            printf '%s\n' "${RELEASE_IDS}" |
              sed '/^[[:space:]]*$/d' |
              wc -l |
              tr -d ' '
          )"

          if [ "${RELEASE_COUNT}" -gt 1 ]; then
            echo "::error::Multiple releases already exist for tag ${RELEASE_TAG}."
            echo "::error::Delete the duplicate draft releases before running this workflow again."
            exit 1
          fi

          if [ "${RELEASE_COUNT}" -eq 1 ]; then
            RELEASE_ID="$(printf '%s\n' "${RELEASE_IDS}" | head -n 1)"

            echo "Using existing release ID: ${RELEASE_ID}"
            echo "release_id=${RELEASE_ID}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ -n "${RELEASE_NAME_INPUT}" ]; then
            RELEASE_NAME="${RELEASE_NAME_INPUT}"
          else
            RELEASE_NAME="PupCode IDE ${RELEASE_TAG}"
          fi

          echo "Creating release: ${RELEASE_NAME}"

          RELEASE_ID="$(
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="${RELEASE_TAG}" \
              -f target_commitish="main" \
              -f name="${RELEASE_NAME}" \
              -f body='PupCode IDE desktop release.

          Choose the installer matching your operating system:
          - Windows x64: NSIS `.exe`
          - macOS Apple Silicon: ARM64 `.dmg`
          - macOS Intel: x64 `.dmg`' \
              -F draft="${RELEASE_DRAFT}" \
              -F prerelease=false \
              --jq '.id'
          )"

          echo "Created release ID: ${RELEASE_ID}"
          echo "release_id=${RELEASE_ID}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.name }}
    needs: create-release

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis

          - name: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg

          - name: macOS Intel
            platform: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/renderer/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/renderer
        run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2

      - name: Build and attach release files
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: >-
            --target ${{ matrix.target }}
            --bundles ${{ matrix.bundles }}